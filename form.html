<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Передача денег</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        h2 {
            text-align: center;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background: #0088cc;
            color: white;
            border: none;
            margin-top: 15px;
            cursor: pointer;
        }
        button:disabled {
            background: #ccc;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Передача денег</h2>

    <label for="recipient">Получатель</label>
    <input type="text" id="recipient" placeholder="Введите получателя">

    <label for="contract">Договор</label>
    <select id="contract">
        <option>Загрузка...</option>
    </select>

    <label for="usd">Сумма (у.е.)</label>
    <input type="number" id="usd" step="0.01">

    <label for="uzs">Сумма (сум)</label>
    <input type="number" id="uzs" step="1">

    <button id="sendBtn">Отправить</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const urlParams = new URLSearchParams(window.location.search);
    const inn = urlParams.get("inn");

    const contractSelect = document.getElementById("contract");
    const sendBtn = document.getElementById("sendBtn");

    async function loadContracts() {
        if (!inn) {
            contractSelect.innerHTML = "<option>Ошибка: ИНН не передан</option>";
            sendBtn.disabled = true;
            return;
        }
        try {
            const url = `http://127.0.0.1:8080/contracts?inn=${encodeURIComponent(inn)}`;
            console.log("📡 Загружаю договоры с:", url);
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Ошибка ${response.status}`);

            const data = await response.json();
            console.log("✅ Ответ сервера:", data);

            if (!Array.isArray(data) || data.length === 0) {
                contractSelect.innerHTML = "<option>Договоров нет</option>";
                return;
            }

            contractSelect.innerHTML = "";
            data.forEach(item => {
                const opt = document.createElement("option");
                opt.value = item.contract;
                opt.textContent = item.contract;
                contractSelect.appendChild(opt);
            });

        } catch (err) {
            console.error("❌ Ошибка загрузки:", err);
            contractSelect.innerHTML = "<option>Ошибка загрузки</option>";
        }
    }

    sendBtn.addEventListener("click", () => {
        const data = {
            recipient: document.getElementById("recipient").value,
            contract: contractSelect.value,
            usd: document.getElementById("usd").value,
            uzs: document.getElementById("uzs").value,
            inn: inn
        };
        console.log("📤 Отправляю данные:", data);
        tg.sendData(JSON.stringify(data));
        tg.close();
    });

    tg.ready();
    loadContracts();
</script>
</body>
</html>
