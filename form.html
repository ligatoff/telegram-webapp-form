<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Передача денег</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    input, select, button { width: 100%; margin-bottom: 10px; padding: 10px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>Передача денег</h2>
  <input type="text" id="recipient" placeholder="Получатель">
  <select id="contract"></select>
  <input type="number" id="usd" placeholder="Сумма (у.е.)">
  <input type="number" id="uzs" placeholder="Сумма (сум)">
  <button onclick="sendData()">Отправить</button>

  <script>
    async function loadContracts() {
      const params = new URLSearchParams(window.location.search);
      const inn = params.get("inn");
      if (!inn) return;
      const res = await fetch(`https://your-server.com/contracts?inn=${inn}`);
      const data = await res.json();
      const select = document.getElementById("contract");
      select.innerHTML = "";
      data.contracts.forEach(c => {
        const option = document.createElement("option");
        option.value = c;
        option.textContent = c;
        select.appendChild(option);
      });
    }

    function sendData() {
      const data = {
        recipient: document.getElementById("recipient").value,
        contract: document.getElementById("contract").value,
        usd: document.getElementById("usd").value,
        uzs: document.getElementById("uzs").value,
      };
      Telegram.WebApp.sendData(JSON.stringify(data));
    }

    loadContracts();
  </script>
</body>
</html>
