<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Передача денег</title>
</head>
<body>
<h2>Передача денег</h2>

<form id="transferForm">
    <label>Получатель: <input type="text" id="recipient" required></label><br><br>
    <label>Договор:
        <select id="contract">
            <option>Загрузка...</option>
        </select>
    </label><br><br>
    <label>Сумма (у.е.): <input type="number" id="usd" required></label><br><br>
    <label>Сумма (сум): <input type="number" id="uzs" required></label><br><br>
    <button type="submit">Отправить</button>
</form>

<script>
const urlParams = new URLSearchParams(window.location.search);
const inn = urlParams.get('inn');
const contractSelect = document.getElementById("contract");

// Загружаем договоры через fetch
async function loadContracts() {
    try {
        const response = await fetch(`https://127.0.0.1:8080/contracts?inn=${inn}`);
        const data = await response.json();
        contractSelect.innerHTML = "";
        if (data.length === 0) {
            contractSelect.innerHTML = "<option>Договоров нет</option>";
            return;
        }
        data.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c.contract;
            opt.textContent = c.contract;
            contractSelect.appendChild(opt);
        });
    } catch (err) {
        contractSelect.innerHTML = "<option>Ошибка загрузки</option>";
        console.error(err);
    }
}

loadContracts();

// Отправка данных в бота
const tg = window.Telegram.WebApp;
const form = document.getElementById("transferForm");
form.addEventListener("submit", e => {
    e.preventDefault();
    const payload = {
        inn: inn,
        recipient: document.getElementById("recipient").value,
        contract: contractSelect.value,
        usd: document.getElementById("usd").value,
        uzs: document.getElementById("uzs").value
    };
    tg.sendData(JSON.stringify(payload));
    alert("Данные отправлены!");
    form.reset();
});
</script>
</body>
</html>
