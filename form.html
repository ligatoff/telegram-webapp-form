<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Передача денег</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        form {
            background: white;
            border-radius: 12px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            margin-top: 15px;
            background: #2e89ff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:disabled {
            background: #ccc;
        }
    </style>
</head>
<body>
    <h2>Передача денег</h2>

    <form id="paymentForm">
        <label for="contract">📄 Договор:</label>
        <select id="contract" name="contract" required>
            <option value="">Загрузка...</option>
        </select>

        <label for="recipient">👤 Получатель:</label>
        <input type="text" id="recipient" name="recipient" placeholder="Введите имя" required>

        <label for="usd">💵 Сумма (у.е.):</label>
        <input type="number" id="usd" name="usd" step="0.01" placeholder="0.00">

        <label for="uzs">💰 Сумма (сум):</label>
        <input type="number" id="uzs" name="uzs" step="1000" placeholder="0">

        <button type="submit">Отправить</button>
    </form>

    <script>
        async function loadContracts() {
            const select = document.getElementById("contract");
            try {
                // ⚠️ Укажи URL API твоего бота, который отдает JSON с договорами
                const inn = sessionStorage.getItem("inn"); // предполагаем, что ты сохраняешь ИНН при авторизации
                const response = await fetch(`https://192.168.12.246:8080/contracts?inn=${inn}`);
                const data = await response.json();

                select.innerHTML = ""; // очищаем "Загрузка..."
                if (data.contracts.length === 0) {
                    const opt = document.createElement("option");
                    opt.text = "Нет договоров";
                    opt.disabled = true;
                    opt.selected = true;
                    select.add(opt);
                } else {
                    data.contracts.forEach(contract => {
                        const opt = document.createElement("option");
                        opt.value = contract;
                        opt.text = contract;
                        select.add(opt);
                    });
                }
            } catch (e) {
                console.error("Ошибка загрузки договоров:", e);
                select.innerHTML = "<option disabled selected>Ошибка загрузки</option>";
            }
        }

        document.addEventListener("DOMContentLoaded", loadContracts);

        const tg = window.Telegram.WebApp;
        document.getElementById("paymentForm").addEventListener("submit", (e) => {
            e.preventDefault();

            const data = {
                contract: document.getElementById("contract").value,
                recipient: document.getElementById("recipient").value,
                usd: document.getElementById("usd").value,
                uzs: document.getElementById("uzs").value
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
