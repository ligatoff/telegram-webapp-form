<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Передача денег</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }
        h2 {
            text-align: center;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            margin-top: 15px;
            width: 100%;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Передача денег</h2>

        <label for="recipient">Получатель</label>
        <input type="text" id="recipient" placeholder="Введите получателя">

        <label for="contract">Договор</label>
        <select id="contract">
            <option disabled selected>Загрузка...</option>
        </select>

        <label for="usd">Сумма (у.е.)</label>
        <input type="number" id="usd" step="0.01" placeholder="Введите сумму в у.е.">

        <label for="uzs">Сумма (сум)</label>
        <input type="number" id="uzs" step="1" placeholder="Введите сумму в сумах">

        <button onclick="sendData()">Отправить</button>
    </div>

    <script>
        // Telegram WebApp API
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Загружаем список договоров
        async function loadContracts() {
            try {
                // ⚠️ Тут подставь свой IP или домен, где крутится бот!
                const inn = tg.initDataUnsafe?.user?.id || ""; 
                const res = await fetch("http://192.168.5.48:8080/contracts?inn=" + inn);
                const data = await res.json();

                const select = document.getElementById("contract");
                select.innerHTML = "";
                if (data.contracts && data.contracts.length > 0) {
                    data.contracts.forEach(c => {
                        let opt = document.createElement("option");
                        opt.value = c;
                        opt.innerText = c;
                        select.appendChild(opt);
                    });
                } else {
                    let opt = document.createElement("option");
                    opt.innerText = "Нет договоров";
                    select.appendChild(opt);
                }
            } catch (e) {
                console.error("Ошибка загрузки договоров", e);
                const select = document.getElementById("contract");
                select.innerHTML = "<option>Ошибка загрузки</option>";
            }
        }

        loadContracts();

        // Отправляем данные боту
        function sendData() {
            const data = {
                recipient: document.getElementById("recipient").value,
                contract: document.getElementById("contract").value,
                usd: document.getElementById("usd").value,
                uzs: document.getElementById("uzs").value,
            };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
