<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Передача денег</title>
    <style>
        body { font-family: sans-serif; margin: 10px; }
        label { display: block; margin-top: 10px; }
        select, input { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 15px; width: 100%; padding: 10px; background: #2b7; color: #fff; border: none; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Передача денег</h2>

    <label for="contract">Договор:</label>
    <select id="contract">
        <option>Загрузка...</option>
    </select>

    <label for="recipient">Получатель:</label>
    <input type="text" id="recipient" placeholder="ФИО получателя">

    <label for="usd">Сумма (у.е.):</label>
    <input type="number" id="usd" step="0.01" placeholder="0.00">

    <label for="uzs">Сумма (сум):</label>
    <input type="number" id="uzs" step="1" placeholder="0">

    <button id="sendBtn">Отправить</button>

    <script>
        // 1. Читаем параметр inn из URL
        const urlParams = new URLSearchParams(window.location.search);
        const inn = urlParams.get("inn");
        console.log("📌 INN из URL:", inn);

        const contractSelect = document.getElementById("contract");

        async function loadContracts() {
            if (!inn) {
                console.error("❌ INN не передан в URL!");
                contractSelect.innerHTML = "<option>Ошибка: нет ИНН</option>";
                return;
            }

            try {
                const url = `http://127.0.0.1:8080/contracts?inn=${inn}`;
                console.log("📡 Загружаю договоры с:", url);

                const response = await fetch(url);
                console.log("📡 HTTP статус:", response.status);

                if (!response.ok) throw new Error(`Ошибка ${response.status}`);

                const data = await response.json();
                console.log("✅ Ответ сервера:", data);

                if (!Array.isArray(data) || data.length === 0) {
                    contractSelect.innerHTML = "<option>Договоров нет</option>";
                    return;
                }

                contractSelect.innerHTML = "";
                data.forEach(c => {
                    const opt = document.createElement("option");
                    opt.value = c.contract;
                    opt.textContent = c.contract;
                    contractSelect.appendChild(opt);
                });

            } catch (err) {
                console.error("❌ Ошибка при загрузке договоров:", err);
                contractSelect.innerHTML = "<option>Ошибка загрузки</option>";
            }
        }

        loadContracts();

        document.getElementById("sendBtn").addEventListener("click", () => {
            const data = {
                inn,
                contract: contractSelect.value,
                recipient: document.getElementById("recipient").value,
                usd: document.getElementById("usd").value,
                uzs: document.getElementById("uzs").value
            };
            console.log("📤 Отправляю данные боту:", data);

            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(JSON.stringify(data));
                window.Telegram.WebApp.close();
            } else {
                alert("Форма открыта вне Telegram, данные в бот не отправятся!");
            }
        });
    </script>
</body>
</html>
