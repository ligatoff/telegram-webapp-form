<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Передача денег</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        h2 {
            text-align: center;
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #0088cc;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled {
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Передача денег</h2>

        <label for="contract">Договор:</label>
        <select id="contract">
            <option>Загрузка...</option>
        </select>

        <label for="recipient">Получатель:</label>
        <input type="text" id="recipient" placeholder="Введите имя">

        <label for="usd">Сумма (у.е.):</label>
        <input type="number" id="usd" placeholder="0.00">

        <label for="uzs">Сумма (сум):</label>
        <input type="number" id="uzs" placeholder="0">

        <button id="sendBtn">Отправить</button>
    </div>

    <script>
        // 1️⃣ Получаем inn из URL
        const params = new URLSearchParams(window.location.search);
        const inn = params.get("inn");

        const contractSelect = document.getElementById("contract");
        const sendBtn = document.getElementById("sendBtn");

        async function loadContracts() {
            if (!inn) {
                contractSelect.innerHTML = `<option disabled>ИНН не передан</option>`;
                sendBtn.disabled = true;
                return;
            }

            try {
                const res = await fetch(`http://127.0.0.1:8080/contracts?inn=${inn}`);
                if (!res.ok) throw new Error("Сервер вернул ошибку");

                const data = await res.json();
                if (!data.contracts || data.contracts.length === 0) {
                    contractSelect.innerHTML = `<option disabled>Договоров нет</option>`;
                    return;
                }

                // Заполняем список договоров
                contractSelect.innerHTML = "";
                data.contracts.forEach(c => {
                    const opt = document.createElement("option");
                    opt.value = c;
                    opt.textContent = c;
                    contractSelect.appendChild(opt);
                });

            } catch (err) {
                console.error(err);
                contractSelect.innerHTML = `<option disabled>Ошибка загрузки</option>`;
            }
        }

        loadContracts();

        // 2️⃣ Обработка кнопки отправки
        document.getElementById("sendBtn").addEventListener("click", () => {
            const data = {
                inn: inn,
                contract: contractSelect.value,
                recipient: document.getElementById("recipient").value,
                usd: document.getElementById("usd").value,
                uzs: document.getElementById("uzs").value
            };

            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.sendData(JSON.stringify(data));
                window.Telegram.WebApp.close();
            } else {
                alert("Telegram WebApp API недоступен");
            }
        });
    </script>
</body>
</html>
