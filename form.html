<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Передача денег</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f8f9fa;
    }
    .container {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; margin-bottom: 15px; }
    label { display: block; margin-top: 10px; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #2c7be5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover { background: #1b5bbf; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Передача денег</h2>
    <label for="recipient">Получатель</label>
    <input type="text" id="recipient" placeholder="Введите получателя">

    <label for="contract">Договор</label>
    <select id="contract"><option>Загрузка...</option></select>

    <label for="usd">Сумма (у.е.)</label>
    <input type="number" id="usd" placeholder="0.00">

    <label for="uzs">Сумма (сум)</label>
    <input type="number" id="uzs" placeholder="0">

    <button onclick="sendData()">Отправить</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const inn = urlParams.get("inn");

    async function loadContracts() {
      try {
        const response = await fetch(`http://192.168.5.48:8080/contracts?inn=${inn}`);
        if (!response.ok) throw new Error("Ошибка загрузки");
        const data = await response.json();
        const contractSelect = document.getElementById("contract");
        contractSelect.innerHTML = "";
        data.forEach(contract => {
          const opt = document.createElement("option");
          opt.value = contract.contract;
          opt.textContent = contract.contract;
          contractSelect.appendChild(opt);
        });
      } catch (e) {
        document.getElementById("contract").innerHTML = "<option>Ошибка загрузки</option>";
      }
    }

    async function sendData() {
      const tg = window.Telegram.WebApp;
      const data = {
        recipient: document.getElementById("recipient").value,
        contract: document.getElementById("contract").value,
        usd: document.getElementById("usd").value,
        uzs: document.getElementById("uzs").value
      };
      tg.sendData(JSON.stringify(data));
      tg.close();
    }

    loadContracts();
  </script>
</body>
</html>
