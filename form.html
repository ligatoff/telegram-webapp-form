<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма передачи денег</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
            background: #f9f9f9;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:disabled {
            background-color: #aaa;
        }
    </style>
</head>
<body>
    <h2>📝 Передача денег</h2>

    <div class="form-group">
        <label for="recipient">👤 Получатель</label>
        <input type="text" id="recipient" placeholder="Введите имя получателя">
    </div>

    <div class="form-group">
        <label for="usd">💵 Сумма (у.е.)</label>
        <input type="number" id="usd" placeholder="Введите сумму в у.е.">
    </div>

    <div class="form-group">
        <label for="uzs">💰 Сумма (сум)</label>
        <input type="number" id="uzs" placeholder="Введите сумму в сум">
    </div>

    <div class="form-group">
        <label for="contract">📄 Договор</label>
        <select id="contract">
            <option>Загрузка...</option>
        </select>
    </div>

    <button id="sendBtn">Отправить</button>

    <script>
        (async () => {
            const contractSelect = document.getElementById("contract");
            const urlParams = new URLSearchParams(window.location.search);
            const inn = urlParams.get("inn");

            if (!inn) {
                contractSelect.innerHTML = "<option>Ошибка: ИНН не передан</option>";
                return;
            }

            try {
                const url = `http://127.0.0.1:8080/contracts?inn=${inn}`;
                console.log("📡 Загружаю договоры с:", url);

                const response = await fetch(url);
                console.log("📡 HTTP статус:", response.status);

                if (!response.ok) throw new Error(`Ошибка ${response.status}`);

                const data = await response.json();
                console.log("✅ Ответ сервера:", data);

                if (!Array.isArray(data) || data.length === 0) {
                    contractSelect.innerHTML = "<option>Договоров нет</option>";
                } else {
                    contractSelect.innerHTML = "";
                    data.forEach(c => {
                        const opt = document.createElement("option");
                        opt.value = c;   // если сервер возвращает массив строк
                        opt.textContent = c;
                        contractSelect.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error(err);
                contractSelect.innerHTML = `<option>Ошибка загрузки договоров</option>`;
            }
        })();

        // Отправка данных обратно в бота
        document.getElementById("sendBtn").addEventListener("click", async () => {
            const data = {
                recipient: document.getElementById("recipient").value,
                usd: document.getElementById("usd").value,
                uzs: document.getElementById("uzs").value,
                contract: document.getElementById("contract").value
            };

            try {
                if (window.Telegram.WebApp) {
                    await window.Telegram.WebApp.sendData(JSON.stringify(data));
                    alert("✅ Данные отправлены боту");
                    window.Telegram.WebApp.close();
                } else {
                    alert("❌ WebApp не обнаружен");
                }
            } catch (err) {
                console.error(err);
                alert("❌ Ошибка при отправке данных");
            }
        });
    </script>
</body>
</html>
