<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Передача денег</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; padding: 10px; background: #f7f7f7; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, button { width: 100%; padding: 8px; margin-top: 5px; font-size: 16px; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; margin-top: 15px; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <h2>📝 Передача денег</h2>

    <label for="recipient">Получатель</label>
    <input type="text" id="recipient" placeholder="Введите имя получателя">

    <label for="usd">Сумма (у.е.)</label>
    <input type="number" id="usd" placeholder="0" min="0">

    <label for="uzs">Сумма (сум)</label>
    <input type="number" id="uzs" placeholder="0" min="0">

    <label for="contract">Договор</label>
    <select id="contract">
        <option>Загрузка...</option>
    </select>

    <button id="send">Отправить</button>

    <script>
        const tg = window.Telegram.WebApp;

        // Получаем ИНН пользователя
        const inn = tg.initDataUnsafe?.user?.id || tg.initDataUnsafe?.user?.username;

        const contractSelect = document.getElementById("contract");

        async function loadContracts() {
            try {
                // Запрос к серверу бота через WebAppData (бот сам отдаёт данные)
                const response = await fetch(`https://ligatoff.github.io/contracts.json?inn=${inn}`);
                const data = await response.json();

                if (!Array.isArray(data) || data.length === 0) {
                    contractSelect.innerHTML = "<option>Договоров нет</option>";
                    return;
                }

                contractSelect.innerHTML = "";
                data.forEach(c => {
                    const opt = document.createElement("option");
                    opt.value = c.contract;
                    opt.textContent = c.contract;
                    contractSelect.appendChild(opt);
                });
            } catch (e) {
                contractSelect.innerHTML = "<option>Ошибка загрузки</option>";
                console.error(e);
            }
        }

        loadContracts();

        document.getElementById("send").addEventListener("click", () => {
            const data = {
                recipient: document.getElementById("recipient").value,
                usd: document.getElementById("usd").value,
                uzs: document.getElementById("uzs").value,
                contract: document.getElementById("contract").value
            };
            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
