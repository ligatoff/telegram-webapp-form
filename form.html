<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Передача денег</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input, button { display: block; margin: 10px 0; width: 100%; padding: 8px; font-size: 16px; }
    </style>
</head>
<body>
    <h2>💸 Форма передачи денег</h2>
    <input type="text" id="recipient" placeholder="Имя получателя">
    <input type="number" id="amount_ue" placeholder="Сумма у.е.">
    <input type="number" id="amount_sum" placeholder="Сумма сум">
    <input type="file" id="photo">
    <button onclick="sendData()">Отправить</button>

    <script>
        function sendData() {
            const data = {
                recipient: document.getElementById("recipient").value,
                amount_ue: document.getElementById("amount_ue").value,
                amount_sum: document.getElementById("amount_sum").value
            };
            Telegram.WebApp.sendData(JSON.stringify(data));
            Telegram.WebApp.close();
        }
    </script>
</body>
</html>
