<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Передача денег</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>💸 Передача денег</h2>

  <label>Договор</label>
  <select id="contractSelect"><option>Загрузка...</option></select>

  <label>Получатель</label>
  <input type="text" id="recipient" placeholder="Введите имя">

  <label>Сумма (у.е)</label>
  <input type="number" id="usd" step="0.01">

  <label>Сумма (сум)</label>
  <input type="number" id="uzs">

  <button onclick="sendData()">Отправить</button>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const inn = urlParams.get("inn");
  const contractSelect = document.getElementById("contractSelect");

  async function loadContracts() {
    try {
      const res = await fetch(`http://192.168.5.48:8080/contracts?inn=${inn}`);
      const data = await res.json();
      contractSelect.innerHTML = "";
      if (!Array.isArray(data) || data.length === 0) {
        contractSelect.innerHTML = "<option>Договоров нет</option>";
        return;
      }
      data.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.contract;
        opt.textContent = c.contract;
        contractSelect.appendChild(opt);
      });
    } catch (e) {
      console.error("Ошибка загрузки договоров", e);
      contractSelect.innerHTML = "<option>Ошибка загрузки</option>";
    }
  }

  function sendData() {
    const data = {
      inn,
      contract: contractSelect.value,
      recipient: document.getElementById("recipient").value,
      usd: document.getElementById("usd").value,
      uzs: document.getElementById("uzs").value
    };
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.sendData(JSON.stringify(data));
      window.Telegram.WebApp.close();
    } else {
      alert("Ошибка: не Telegram WebApp");
    }
  }

  loadContracts();
</script>
</body>
</html>
